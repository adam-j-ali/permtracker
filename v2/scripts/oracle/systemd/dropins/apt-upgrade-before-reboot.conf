# /etc/systemd/system/apt-daily-upgrade.timer.d/permtracker.conf
# The nightly upgrade runs in the ten minutes after 06:00 UTC, so it is done before the 06:30 UTC reboot an update
# may ask for (conf/apt-reboot-permtracker.conf). Ubuntu's own setting spreads it over an hour, which put it after
# the reboot about half the nights. Nov 13 2026: the server rebooted at 06:30, then upgraded at 06:44 and 06:59,
# which restarted the site's services three more times and queued another reboot for the night after.
[Timer]
RandomizedDelaySec=10m
