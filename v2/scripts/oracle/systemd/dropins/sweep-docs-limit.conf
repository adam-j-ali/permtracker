# /etc/systemd/system/permtracker-sweep@case-status-docs.service.d/limit.conf
# The rebuild of the stored documents after a deploy (permtracker-sweep case-status-docs) takes about ten minutes
# on a quiet disk, and over half an hour while a release's old page cache is being deleted beside it (Nov 12 2026).
# It shares the case sweeps' lock, and a sweep that finds the lock taken skips its run, so this unit is stopped at
# 75 minutes whatever it is doing. The job itself gives way when a sweep is due within 80 (DOCS_GIVE_WAY in
# bin/permtracker-sweep): the limit must stay under that figure. A oneshot unit is limited by its start timeout.
[Service]
TimeoutStartSec=75min
