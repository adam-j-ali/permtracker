// /etc/apt/apt.conf.d/52permtracker-reboot
// Updates install every night, and the server never reboots for them by itself. A reboot an update asks for waits
// for Sunday at 1:30 AM Eastern (systemd/permtracker-weekly-reboot.timer, bin/permtracker-weekly-reboot). A restart
// takes the site off its tunnel for about a minute, and on Nov 13 and 14 2026 those minutes held every server error
// of three days, one of them Googlebot's, which failed a Search Console validation. Eastern time also keeps the
// restart off the 2 AM release in summer, which the old 06:30 UTC setting landed on.
Unattended-Upgrade::Automatic-Reboot "false";
