// /etc/apt/apt.conf.d/52permtracker-reboot
// Reboot by itself when an update needs one, at 06:30 UTC: 1:30 AM Eastern in winter, half an hour before the
// night release. In summer that is 2:30 AM Eastern, inside the release: move it before the clocks change.
// The upgrade itself runs just after 06:00 UTC (systemd/dropins/apt-upgrade-before-reboot.conf), so one night's
// updates and their reboot are one event.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "06:30";
