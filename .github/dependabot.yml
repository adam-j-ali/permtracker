version: 2
# Tuesday, not Monday: keeps a Monday free of dependency PRs.
updates:
  # Frontend dependencies (npm) - v2 directory
  - package-ecosystem: "npm"
    directory: "/v2"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep @types/node on v24: the server runs Node 24 (engines.node 24.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A Next.js major changes rendering and caching behaviour, so it is
      # upgraded by hand; minors and patches come through here.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # @sentry/nextjs comes in by hand. A release has broken the suite on
      # import while the production build was fine (10.72 read
      # `import.meta.url` in its CJS build), and since 11.x what Sentry
      # collects depends on options a release can change (dataCollection,
      # span streaming), which the Privacy Policy relies on. v2/package.json
      # pins ~11.14.0 (Nov 24 2026); a newer version comes in after the full
      # suite, src/lib/__tests__/sentry-config.test.ts included, passes with it.
      - dependency-name: "@sentry/nextjs"
        versions: [">=11.15.0"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # CodeQL's actions (and Semgrep's upload-sarif) must move together: init
    # writes a config stamped with its own version and the later steps refuse
    # one from another version.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
